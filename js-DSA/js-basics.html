// Q5

// Ternary OperatorA shortcut for if-else. It evaluates a condition and returns one of two values 

age = 20;
let status = (age >= 18) ? "Adult" : "Minor";
console.log(status); // Output: Adult


// Q6
// Nested Ternary OperatorChains multiple conditions together. Read from left to right

score = 85;
let grade = (score >= 90) ? "A" : (score >= 80) ? "B" : "C";
console.log(grade); // Output: B


// Q7

// Switch Case (Multiple Values)Omitting the break statement lets multiple cases execute the same code block.

fruit = "apple";
switch (fruit) {
  case "apple":
  case "banana":
  case "orange":
    console.log("This is a fruit.");
    break;
  default:
    console.log("Unknown food.");
}

// Output: This is a fruit.


// Q8 
// Switch Case Precision Issuesswitch statements use strict equality (===). They check both the value and the data type. 
// Floating-point math can cause unexpected mismatches. 

value = 0.1 + 0.2; // Evaluates to 0.30000000000000004 due to binary precision
switch (value) {
  case 0.3:
    console.log("Matches 0.3");
    break;
  default:
    console.log("Does not match 0.3 exactly!"); 
}
// Output: Does not match 0.3 exactly!
