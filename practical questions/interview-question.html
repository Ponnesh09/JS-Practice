    <script>
        
        // Q1 Count Vowels in a String

        let a = "javascript"
        let vowels = ["a","e","i","o","u"];
        let count = 0

        for(let i=0; i<a.length; i++){
            if(vowels.includes(a[i])) count++
        }
        console.log(count);
        
        // output = 3 


        // Q2 Count Character Frequency 

       let name = "peter parker"
       let obj = {}

       for(let i=0; i<name.length; i++){
        if(obj[name[i]]) obj[name[i]]++ ;
        else obj[name[i]] = 1 ;
       }

       console.log(obj);

       //   output = {p: 2, e: 3, t: 1, r: 3, " ": 1, …}
       
        

       //Q3 Find Largest Number in Array

       let arr = [12,45,3,56,8,2,1]
       let ans = arr[0]

       for(let i=0; i<arr.length; i++){
        if(arr[i]>ans) ans = arr[i]
       }
       console.log(ans);
       
    //    output = 56


    //Q4 check palindrome

       let word = "madam"

       let i = 0;
       let j = word.length-1

    function checkPalindrome (){
        while (i<=j) {
            if(word[i] != word[j]) return false
        i++
        j--
     }
        return true
    }
    console.log(checkPalindrome(word));
