    <script>
// function in js

// Q1 what is function declaration
        // nothing but is like writing function is also called function definition and function statement


function add (a,b){
    return a+b
}
// console.log(add(2,2));



// Q2 what is function expression
// when you store a function inside of variable its call function expression it also called anonymous function and callback function

const multiple = function(c,d){
    return c*d
}
// console.log(multiple(2,4));


// Q3 what are first class function
// the function can be treated like variable call first class function 

function displayMultiple(fn){
    console.log(`multiple is ${fn(5,2)}`);
}

// displayMultiple(multiple)


// Q4 what is IIFE

(function(num){
    console.log(num * num);
})(5);



//Q5 

(function(X){
    return(function(Y){
        console.log(X);
    })(2)
})(1)


// Q6 function scope

// The following variables are defined in the global scope
const num1 = 2;
const num2 = 4;
const name = "jon";

// This function is defined in the global scope
function multiply() {
  return num1 * num2;
}

// console.log(multiply()); // 60

// A nested function example
function getScore() {
  const num1 = 2;
  const num2 = 5;

  function add() {
    return `${name} scored ${num1 + num2}`;
  }

  return add();
}

// console.log(getScore()); // "jon scored 7"


// Q7 function scope O/P Based Question 

for(var i = 0;  i < 5; i++){
    setTimeout(function () {
        console.log(i);
        
    }, i * 1000)
}
